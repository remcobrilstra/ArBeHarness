[package]
name = "arbe-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arbe-core = { workspace = true }
arbe-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

# Test-only MCP server used by tests/client.rs (not part of the harness).
[[bin]]
name = "mcp-fixture-server"
path = "tests/fixture/mcp_fixture_server.rs"
test = false
doc = false

[dev-dependencies]
arbe-tools = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

